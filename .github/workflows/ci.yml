name: CI

on: [pull_request, push]

jobs: 
  continuos-integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Build application
        run: yarn build

      - name: Run Unit tests
        run: yarn test

      - name: Run E2E tests
        run: yarn test